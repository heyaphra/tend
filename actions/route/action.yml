name: 'Tend — route security events'
description: 'Route Dependabot PRs (and v1.1: alerts) to .tend/owners.yml owners with security-label awareness.'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  owners-file:
    description: 'Path to .tend/owners.yml'
    default: '.tend/owners.yml'
  routing-mode:
    description: 'assign | request-review | comment | all (bot PRs always use request-review)'
    default: 'request-review'
  dry-run:
    description: 'When true, log the routing plan without calling GitHub write APIs'
    default: 'false'
  github-token:
    description: 'Token for assignment and review-request API'
    default: ${{ github.token }}
  security-cc:
    description: 'Team/user (e.g. @org/appsec) to CC when the PR has a "security" label.'
    default: ''
  fallback-owner:
    description: 'Handle to route to when no per-file rule matches (e.g. @org/appsec).'
    default: ''
  extra-skip-paths:
    description: 'Newline-separated extra skip patterns. Built-ins: node_modules/, vendor/, dist/, build/, *.lock'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install tend
      shell: bash
      run: |
        pip install --quiet "${{ github.action_path }}/../.."

    - name: Route event
      shell: bash
      env:
        TEND_GITHUB_TOKEN: ${{ inputs.github-token }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_PATH: ${{ github.event_path }}
        TEND_SECURITY_CC: ${{ inputs.security-cc }}
        TEND_FALLBACK_OWNER: ${{ inputs.fallback-owner }}
        TEND_EXTRA_SKIP_PATHS: ${{ inputs.extra-skip-paths }}
      run: |
        # v1 routes only Dependabot-authored pull_request events; all other
        # PRs are logged and skipped by the CLI. dependabot_alert events
        # are recognized and logged but not routed — full handling lands
        # in v1.1.
        ARGS=(
          --owners-file "${{ inputs.owners-file }}"
          --mode "${{ inputs.routing-mode }}"
          --repo "${{ github.repository }}"
        )
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          ARGS+=(--dry-run)
        fi
        if [ -n "$TEND_SECURITY_CC" ]; then
          ARGS+=(--security-cc "$TEND_SECURITY_CC")
        fi
        if [ -n "$TEND_FALLBACK_OWNER" ]; then
          ARGS+=(--fallback-owner "$TEND_FALLBACK_OWNER")
        fi
        # extra-skip-paths is newline-separated; emit one --extra-skip-path per line.
        if [ -n "$TEND_EXTRA_SKIP_PATHS" ]; then
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            ARGS+=(--extra-skip-path "$path")
          done <<< "$TEND_EXTRA_SKIP_PATHS"
        fi
        tend route "${ARGS[@]}"
