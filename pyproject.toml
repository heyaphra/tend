[project]
name = "tend"
version = "0.1.0"
description = "Infer code ownership from contribution patterns and route security findings"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "heyaphra", email = "hey.aphra@gmail.com" }]
keywords = ["codeowners", "ownership", "security", "github", "vulnerability-management"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "httpx[http2]>=0.27",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.8",
  "rich>=13.7",
]

[project.scripts]
tend = "tend.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PT", "RET", "ARG"]
# RUF002/RUF003 flag unicode math symbols (×, α) in our scoring/shrinkage
# docstrings — these are intentional and improve formula readability.
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# B008: typer.Option in argument defaults is the canonical Typer pattern.
"src/tend/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=tend --cov-report=term-missing"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
branch = true
source = ["src/tend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
